<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="'Trebuchet MS','Arial Rounded MT Bold',sans-serif">
  <rect width="700" height="400" fill="#FFFDF8"/>
  <text x="350" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2B2119">an N-ary tree of processes</text>

  <!-- root controller -->
  <rect x="290" y="52" width="120" height="44" rx="14" fill="#EBDCF0" stroke="#2B2119" stroke-width="3"/>
  <text x="350" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#2B2119">controller</text>

  <!-- pipes from root to mergers -->
  <path d="M330 96 C 300 130, 240 130, 210 150" fill="none" stroke="#8C5A3C" stroke-width="7" stroke-linecap="round"/>
  <path d="M350 96 L350 150" fill="none" stroke="#8C5A3C" stroke-width="7" stroke-linecap="round"/>
  <path d="M370 96 C 400 130, 460 130, 490 150" fill="none" stroke="#8C5A3C" stroke-width="7" stroke-linecap="round"/>

  <!-- merger nodes -->
  <g>
    <rect x="150" y="150" width="116" height="40" rx="13" fill="#C9F0E5" stroke="#2B2119" stroke-width="3"/>
    <text x="208" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B2119">merger</text>
    <rect x="292" y="150" width="116" height="40" rx="13" fill="#C9F0E5" stroke="#2B2119" stroke-width="3"/>
    <text x="350" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B2119">merger</text>
    <rect x="434" y="150" width="116" height="40" rx="13" fill="#C9F0E5" stroke="#2B2119" stroke-width="3"/>
    <text x="492" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B2119">merger</text>
  </g>

  <!-- pipes to workers -->
  <g stroke="#8C5A3C" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M186 190 L166 232"/><path d="M230 190 L250 232"/>
    <path d="M328 190 L308 232"/><path d="M372 190 L392 232"/>
    <path d="M470 190 L450 232"/><path d="M514 190 L534 232"/>
  </g>

  <!-- workers -->
  <g>
    <circle cx="160" cy="258" r="26" fill="#FDE7B8" stroke="#2B2119" stroke-width="3"/>
    <circle cx="256" cy="258" r="26" fill="#FDE7B8" stroke="#2B2119" stroke-width="3"/>
    <circle cx="302" cy="258" r="26" fill="#FDE7B8" stroke="#2B2119" stroke-width="3"/>
    <circle cx="398" cy="258" r="26" fill="#FDE7B8" stroke="#2B2119" stroke-width="3"/>
    <circle cx="444" cy="258" r="26" fill="#FDE7B8" stroke="#2B2119" stroke-width="3"/>
    <circle cx="540" cy="258" r="26" fill="#FDE7B8" stroke="#2B2119" stroke-width="3"/>
    <text x="160" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#2B2119">wrk</text>
    <text x="256" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#2B2119">wrk</text>
    <text x="302" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#2B2119">wrk</text>
    <text x="398" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#2B2119">wrk</text>
    <text x="444" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#2B2119">wrk</text>
    <text x="540" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#2B2119">wrk</text>
  </g>

  <!-- upward data flow arrows -->
  <g stroke="#4E9F3D" stroke-width="3.4" fill="none" stroke-linecap="round">
    <path d="M600 300 L600 120"/>
    <path d="M588 136 L600 118 L612 136"/>
  </g>
  <text x="600" y="322" text-anchor="middle" font-size="13" fill="#4E9F3D" font-weight="bold">streams</text>
  <text x="600" y="340" text-anchor="middle" font-size="13" fill="#4E9F3D" font-weight="bold">merge up</text>

  <!-- syscall chips -->
  <g font-size="13" font-weight="bold">
    <rect x="60" y="342" width="82" height="30" rx="15" fill="#FFFDF8" stroke="#2B2119" stroke-width="2.6"/>
    <text x="101" y="362" text-anchor="middle" fill="#7A4988">fork()</text>
    <rect x="152" y="342" width="82" height="30" rx="15" fill="#FFFDF8" stroke="#2B2119" stroke-width="2.6"/>
    <text x="193" y="362" text-anchor="middle" fill="#7A4988">exec()</text>
    <rect x="244" y="342" width="82" height="30" rx="15" fill="#FFFDF8" stroke="#2B2119" stroke-width="2.6"/>
    <text x="285" y="362" text-anchor="middle" fill="#7A4988">pipe()</text>
    <rect x="336" y="342" width="128" height="30" rx="15" fill="#FFFDF8" stroke="#2B2119" stroke-width="2.6"/>
    <text x="400" y="362" text-anchor="middle" fill="#7A4988">socketpair()</text>
  </g>
</svg>
