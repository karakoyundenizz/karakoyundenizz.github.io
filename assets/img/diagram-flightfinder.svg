<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="'Trebuchet MS','Arial Rounded MT Bold',sans-serif">
  <rect width="700" height="400" fill="#FFFDF8"/>
  <text x="350" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2B2119">airports are nodes, flights are edges</text>

  <!-- edges (multigraph: parallel edges between some pairs) -->
  <g fill="none" stroke-linecap="round">
    <!-- ESB -> IST two parallel edges -->
    <path d="M150 150 C 240 70, 360 70, 450 108" stroke="#C9B9A6" stroke-width="4"/>
    <path d="M150 150 C 250 110, 350 100, 450 116" stroke="#8B1E3F" stroke-width="5"/>
    <!-- ESB -> IZM -->
    <path d="M150 150 C 160 240, 190 290, 250 316" stroke="#C9B9A6" stroke-width="4"/>
    <!-- IZM -> IST -->
    <path d="M250 316 C 330 280, 400 200, 452 124" stroke="#C9B9A6" stroke-width="4"/>
    <!-- IST -> TZX -->
    <path d="M470 110 C 540 120, 590 160, 614 210" stroke="#8B1E3F" stroke-width="5"/>
    <!-- IZM -> TZX -->
    <path d="M262 318 C 400 350, 540 300, 612 222" stroke="#C9B9A6" stroke-width="4"/>
  </g>

  <!-- arrowheads on the chosen path -->
  <g fill="#8B1E3F">
    <path d="M436 100 L454 114 L434 122 Z"/>
    <path d="M600 194 L616 212 L594 214 Z"/>
  </g>

  <!-- weights -->
  <g font-size="12.5" font-weight="bold">
    <rect x="264" y="64" width="86" height="24" rx="12" fill="#FFFDF8" stroke="#2B2119" stroke-width="2.4"/>
    <text x="307" y="81" text-anchor="middle" fill="#5C4B3B">₺ 90 · 1h05</text>
    <rect x="272" y="118" width="86" height="24" rx="12" fill="#FFFDF8" stroke="#8B1E3F" stroke-width="2.6"/>
    <text x="315" y="135" text-anchor="middle" fill="#8B1E3F">₺ 74 · 1h10</text>
    <rect x="530" y="128" width="86" height="24" rx="12" fill="#FFFDF8" stroke="#8B1E3F" stroke-width="2.6"/>
    <text x="573" y="145" text-anchor="middle" fill="#8B1E3F">₺ 61 · 1h30</text>
    <rect x="410" y="330" width="86" height="24" rx="12" fill="#FFFDF8" stroke="#2B2119" stroke-width="2.4"/>
    <text x="453" y="347" text-anchor="middle" fill="#5C4B3B">₺ 130 · 2h</text>
  </g>

  <!-- airport nodes -->
  <g font-size="14" font-weight="bold">
    <circle cx="150" cy="150" r="30" fill="#FDE7B8" stroke="#2B2119" stroke-width="3.4"/>
    <text x="150" y="156" text-anchor="middle" fill="#2B2119">ESB</text>
    <circle cx="460" cy="112" r="30" fill="#C9F0E5" stroke="#2B2119" stroke-width="3.4"/>
    <text x="460" y="118" text-anchor="middle" fill="#2B2119">IST</text>
    <circle cx="252" cy="318" r="30" fill="#D9EBF6" stroke="#2B2119" stroke-width="3.4"/>
    <text x="252" y="324" text-anchor="middle" fill="#2B2119">ADB</text>
    <circle cx="618" cy="218" r="30" fill="#EBDCF0" stroke="#2B2119" stroke-width="3.4"/>
    <text x="618" y="224" text-anchor="middle" fill="#2B2119">TZX</text>
  </g>

  <!-- tiny plane on the chosen route -->
  <g transform="translate(300,96) rotate(8)">
    <path d="M0 0 L26 6 L0 12 L6 6 Z" fill="#12907E" stroke="#2B2119" stroke-width="2"/>
    <path d="M8 6 L2 -6 M8 6 L2 18" stroke="#2B2119" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- legend -->
  <g font-size="13" font-weight="bold">
    <path d="M64 356 L108 356" stroke="#8B1E3F" stroke-width="5" stroke-linecap="round"/>
    <text x="118" y="361" fill="#8B1E3F">Dijkstra's pick (cost × time blend)</text>
    <path d="M368 356 L412 356" stroke="#C9B9A6" stroke-width="4" stroke-linecap="round"/>
    <text x="422" y="361" fill="#5C4B3B">other flights (multigraph!)</text>
  </g>
</svg>
