<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="'Trebuchet MS','Arial Rounded MT Bold',sans-serif">
  <rect width="700" height="400" fill="#FFFDF8"/>
  <text x="350" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2B2119">who trained what, on which data, and how it went</text>

  <!-- Models table -->
  <g>
    <rect x="56" y="70" width="180" height="150" rx="14" fill="#FFFDF8" stroke="#2B2119" stroke-width="3.4"/>
    <rect x="56" y="70" width="180" height="38" rx="14" fill="#EBDCF0" stroke="#2B2119" stroke-width="3.4"/>
    <rect x="56" y="94" width="180" height="14" fill="#EBDCF0"/>
    <text x="146" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#2B2119">Models</text>
    <g font-size="12.5" fill="#5C4B3B">
      <text x="72" y="130">model_id 🔑</text>
      <text x="72" y="152">name</text>
      <text x="72" y="174">owner_id</text>
      <text x="72" y="196">version</text>
    </g>
  </g>

  <!-- Datasets table -->
  <g>
    <rect x="464" y="70" width="180" height="150" rx="14" fill="#FFFDF8" stroke="#2B2119" stroke-width="3.4"/>
    <rect x="464" y="70" width="180" height="38" rx="14" fill="#C9F0E5" stroke="#2B2119" stroke-width="3.4"/>
    <rect x="464" y="94" width="180" height="14" fill="#C9F0E5"/>
    <text x="554" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#2B2119">Datasets</text>
    <g font-size="12.5" fill="#5C4B3B">
      <text x="480" y="130">dataset_id 🔑</text>
      <text x="480" y="152">name</text>
      <text x="480" y="174">domain</text>
      <text x="480" y="196">size</text>
    </g>
  </g>

  <!-- Runs table (junction) -->
  <g>
    <rect x="252" y="200" width="196" height="160" rx="14" fill="#FFFDF8" stroke="#2B2119" stroke-width="3.4"/>
    <rect x="252" y="200" width="196" height="38" rx="14" fill="#FDE7B8" stroke="#2B2119" stroke-width="3.4"/>
    <rect x="252" y="224" width="196" height="14" fill="#FDE7B8"/>
    <text x="350" y="226" text-anchor="middle" font-size="15" font-weight="bold" fill="#2B2119">Runs</text>
    <g font-size="12.5" fill="#5C4B3B">
      <text x="268" y="260">run_id 🔑</text>
      <text x="268" y="282">model_id →</text>
      <text x="268" y="304">dataset_id →</text>
      <text x="268" y="326">accuracy · loss</text>
      <text x="268" y="348">finished_at</text>
    </g>
  </g>

  <!-- relations -->
  <g stroke="#7A4988" stroke-width="3.6" fill="none" stroke-linecap="round">
    <path d="M146 220 C 160 260, 210 280, 250 284"/>
    <path d="M554 220 C 540 260, 490 296, 450 304"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#7A4988">
    <text x="150" y="256">1 ⟶ *</text>
    <text x="516" y="262">1 ⟶ *</text>
  </g>

  <!-- SQL chip -->
  <rect x="500" y="300" width="150" height="60" rx="14" fill="#2B2119"/>
  <g font-family="Menlo, Courier, monospace" font-size="12">
    <text x="514" y="324" fill="#7BB661">SELECT AVG(acc)</text>
    <text x="514" y="342" fill="#F6F5F1">GROUP BY model</text>
  </g>

  <!-- normalized badge -->
  <rect x="56" y="310" width="140" height="30" rx="15" fill="#FFFDF8" stroke="#2B2119" stroke-width="2.6"/>
  <text x="126" y="330" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7A4988">normalized ✓</text>
</svg>
