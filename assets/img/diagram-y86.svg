<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="'Trebuchet MS','Arial Rounded MT Bold',sans-serif">
  <rect width="700" height="400" fill="#FFFDF8"/>
  <text x="350" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2B2119">five stages, zero wasted cycles</text>

  <!-- pipeline stages -->
  <g font-size="14" font-weight="bold">
    <rect x="40"  y="70" width="110" height="52" rx="13" fill="#FDE7B8" stroke="#2B2119" stroke-width="3"/>
    <text x="95"  y="102" text-anchor="middle" fill="#2B2119">Fetch</text>
    <rect x="170" y="70" width="110" height="52" rx="13" fill="#FCE9C0" stroke="#2B2119" stroke-width="3"/>
    <text x="225" y="102" text-anchor="middle" fill="#2B2119">Decode</text>
    <rect x="300" y="70" width="110" height="52" rx="13" fill="#C9F0E5" stroke="#2B2119" stroke-width="3"/>
    <text x="355" y="102" text-anchor="middle" fill="#2B2119">Execute</text>
    <rect x="430" y="70" width="110" height="52" rx="13" fill="#D9EBF6" stroke="#2B2119" stroke-width="3"/>
    <text x="485" y="102" text-anchor="middle" fill="#2B2119">Memory</text>
    <rect x="560" y="70" width="110" height="52" rx="13" fill="#EBDCF0" stroke="#2B2119" stroke-width="3"/>
    <text x="615" y="96" text-anchor="middle" fill="#2B2119">Write</text>
    <text x="615" y="114" text-anchor="middle" fill="#2B2119">back</text>
  </g>
  <g stroke="#2B2119" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M150 96 L166 96 M160 90 L168 96 L160 102"/>
    <path d="M280 96 L296 96 M290 90 L298 96 L290 102"/>
    <path d="M410 96 L426 96 M420 90 L428 96 L420 102"/>
    <path d="M540 96 L556 96 M550 90 L558 96 L550 102"/>
  </g>

  <!-- instructions in flight -->
  <g font-size="12" font-weight="bold">
    <rect x="52"  y="140" width="86" height="26" rx="13" fill="#FFFDF8" stroke="#2B2119" stroke-width="2.4"/>
    <text x="95"  y="158" text-anchor="middle" fill="#12907E">irmovq</text>
    <rect x="182" y="140" width="86" height="26" rx="13" fill="#FFFDF8" stroke="#2B2119" stroke-width="2.4"/>
    <text x="225" y="158" text-anchor="middle" fill="#12907E">addq</text>
    <rect x="312" y="140" width="86" height="26" rx="13" fill="#FFFDF8" stroke="#2B2119" stroke-width="2.4"/>
    <text x="355" y="158" text-anchor="middle" fill="#12907E">mrmovq</text>
    <rect x="442" y="140" width="86" height="26" rx="13" fill="#FFFDF8" stroke="#2B2119" stroke-width="2.4"/>
    <text x="485" y="158" text-anchor="middle" fill="#12907E">rmmovq</text>
    <rect x="572" y="140" width="86" height="26" rx="13" fill="#FFFDF8" stroke="#2B2119" stroke-width="2.4"/>
    <text x="615" y="158" text-anchor="middle" fill="#12907E">jne</text>
  </g>

  <!-- hazard spark between decode and execute -->
  <path d="M288 190 L296 206 L282 206 L292 226 L286 208 L300 208 Z" fill="#E9A820" stroke="#2B2119" stroke-width="2"/>
  <text x="330" y="212" font-size="13" font-weight="bold" fill="#8B1E3F">data hazard →</text>
  <text x="330" y="230" font-size="13" font-weight="bold" fill="#4E9F3D">forwarded ✓</text>

  <!-- CPE meter -->
  <text x="120" y="270" font-size="15" font-weight="bold" fill="#2B2119">CPE (cycles per element)</text>
  <rect x="60" y="286" width="400" height="30" rx="15" fill="#F6D5DE" stroke="#2B2119" stroke-width="3"/>
  <rect x="60" y="286" width="150" height="30" rx="15" fill="#7BB661" stroke="#2B2119" stroke-width="3"/>
  <text x="135" y="306" text-anchor="middle" font-size="13" font-weight="bold" fill="#2B2119">after</text>
  <text x="340" y="306" text-anchor="middle" font-size="13" font-weight="bold" fill="#8B1E3F">before</text>
  <g stroke="#4E9F3D" stroke-width="3.4" fill="none" stroke-linecap="round">
    <path d="M480 301 L520 301 M506 291 L488 301 L506 311"/>
  </g>
  <text x="536" y="306" font-size="13" font-weight="bold" fill="#4E9F3D">smaller!</text>

  <!-- tricks -->
  <g font-size="12.5" font-weight="bold">
    <rect x="60" y="342" width="128" height="30" rx="15" fill="#FFFDF8" stroke="#2B2119" stroke-width="2.6"/>
    <text x="124" y="362" text-anchor="middle" fill="#7A4988">loop unrolling</text>
    <rect x="198" y="342" width="122" height="30" rx="15" fill="#FFFDF8" stroke="#2B2119" stroke-width="2.6"/>
    <text x="259" y="362" text-anchor="middle" fill="#7A4988">reordering</text>
    <rect x="330" y="342" width="150" height="30" rx="15" fill="#FFFDF8" stroke="#2B2119" stroke-width="2.6"/>
    <text x="405" y="362" text-anchor="middle" fill="#7A4988">custom HCL logic</text>
  </g>
</svg>
